name: ELVORAQ quality checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check JavaScript syntax
        run: |
          node --check app.js
          find api lib -type f -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Run security and feature smoke tests
        run: node --test tests/*.test.mjs
